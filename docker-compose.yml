services:
  postgres:
    image: postgres:16-alpine
    container_name: swi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse_secret
      POSTGRES_DB: smart_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d smart_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: swi_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://warehouse:warehouse_secret@postgres:5432/smart_warehouse?schema=public
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-warehouse_iot}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-iot_broker_password}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_strong_32_char_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"

  frontend:
    image: node:22-alpine
    container_name: swi_frontend_dev
    working_dir: /app
    profiles: ["dev"]
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
